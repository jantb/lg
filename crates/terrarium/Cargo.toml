[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "terrarium"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "io-std", "time", "net"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1.1"
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
sysinfo = "0.38"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
inquire = "0.9"
ratatui = "0.30"
crossterm = "0.29"
